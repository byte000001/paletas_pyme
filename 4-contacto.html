<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaletasLaPiñita</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--rosa:#E8527F;--rosa-claro:#FDEEF3;--menta:#2BB59A;--sol:#FFB84D;--tinta:#2B2433;--gris:#6B6475;--fondo:#FFFBF7}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',Arial,sans-serif;color:var(--tinta);background:var(--fondo);line-height:1.6}
h1,h2,h3{font-family:'Fredoka','Nunito',Arial,sans-serif;font-weight:600;line-height:1.2}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:10;background:rgba(255,251,247,.94);border-bottom:1px solid #F0E6EA}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Fredoka',sans-serif;font-size:22px;color:var(--rosa);text-decoration:none;font-weight:600}
nav a{margin-left:22px;text-decoration:none;color:var(--tinta);font-weight:600;font-size:15px}
nav a:hover{color:var(--rosa)}
.btn{display:inline-block;background:var(--rosa);color:#fff;padding:13px 26px;border-radius:999px;text-decoration:none;font-weight:600;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:transparent;color:var(--rosa);border:2px solid var(--rosa);margin-left:10px}
.hero{background:var(--rosa-claro);padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.eyebrow{display:inline-block;background:#fff;color:var(--rosa);font-weight:600;font-size:13px;padding:5px 14px;border-radius:999px;margin-bottom:16px}
.hero h1{font-size:clamp(34px,5vw,54px);margin-bottom:16px}
.hero p{color:var(--gris);font-size:18px;margin-bottom:28px;max-width:480px}
.pops{display:flex;gap:18px;justify-content:center;align-items:flex-end}
.pop{display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.pop:hover{transform:translateY(-8px) rotate(-3deg)}
.pop .b{width:64px;height:130px;border-radius:32px 32px 12px 12px;position:relative}
.pop .b:after{content:"";position:absolute;left:12px;top:16px;width:8px;height:48px;border-radius:4px;background:rgba(255,255,255,.45)}
.pop .s{width:14px;height:36px;background:#E3C9A0;border-radius:0 0 6px 6px}
section{padding:72px 0}
.titulo{text-align:center;margin-bottom:40px}
.titulo h2{font-size:clamp(28px,4vw,38px);margin-bottom:8px}
.titulo p{color:var(--gris)}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid #F0E6EA;border-radius:20px;padding:28px 22px;text-align:center}
.card .ic{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-family:'Fredoka',sans-serif;color:#fff}
.card h3{font-size:19px;margin-bottom:6px}
.card p{color:var(--gris);font-size:15px}
.sabor{padding:24px 18px}
.sabor .pop{margin-bottom:14px}
.sabor .pop .b{width:48px;height:92px;border-radius:24px 24px 10px 10px}
.sabor .pop .b:after{left:9px;top:12px;width:6px;height:32px}
.sabor .pop .s{height:26px;width:11px}
.precio{display:inline-block;margin-top:8px;font-weight:600;color:var(--rosa)}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:#E3F6F1;color:#13715F;font-weight:600;margin-left:6px}
.pasos{background:var(--tinta);color:#fff}
.pasos .titulo p{color:#CFC8D6}
.pasos .num{width:44px;height:44px;border-radius:50%;background:var(--sol);color:var(--tinta);font-family:'Fredoka',sans-serif;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.pasos .card{background:#3A3144;border-color:#4A4056}
.pasos .card p{color:#CFC8D6}
.contacto .wrap{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.info{background:var(--rosa-claro);border-radius:20px;padding:32px}
.info h3{font-size:24px;margin-bottom:16px}
.info p{margin-bottom:10px}
.info strong{color:var(--rosa)}
.mapa{border-radius:20px;overflow:hidden;min-height:280px;background:#E3F6F1;display:flex;align-items:center;justify-content:center;color:#13715F;font-weight:600;text-align:center;padding:20px}
footer{background:#1F1A26;color:#B9B1C2;text-align:center;padding:28px 24px;font-size:14px}
footer a{color:#fff;margin:0 8px;text-decoration:none}
@media(max-width:820px){
.hero .wrap,.contacto .wrap{grid-template-columns:1fr}
.g3,.g4{grid-template-columns:1fr 1fr}
nav a:not(.btn){display:none}
.hero{padding:48px 0}
section{padding:52px 0}
}
@media(max-width:480px){.g3,.g4{grid-template-columns:1fr}.btn.sec{margin:12px 0 0}}
.hero-img{height:230px;width:auto;filter:drop-shadow(0 10px 12px rgba(43,36,51,.2));transition:transform .2s}
.hero-img:hover{transform:translateY(-8px) rotate(-3deg)}
.sabor img{height:190px;width:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 8px 8px rgba(43,36,51,.15));transition:transform .2s}
.sabor:hover img{transform:translateY(-6px) rotate(-3deg)}
.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
@media(max-width:820px){.hero-img{height:150px}}
.qty{display:inline-flex;align-items:center;gap:14px;margin-top:14px;background:var(--rosa-claro);border-radius:999px;padding:4px}
.qty button{width:36px;height:36px;border-radius:50%;border:0;background:var(--rosa);color:#fff;font-size:20px;font-weight:600;cursor:pointer;line-height:1}
.qty button:hover{filter:brightness(1.08)}
.qty .n{min-width:22px;font-weight:600;font-size:17px}
.sabor.sel{border-color:var(--rosa);box-shadow:0 0 0 2px var(--rosa-claro)}
.pedido{background:var(--rosa-claro)}
.caja{max-width:640px;margin:0 auto;background:#fff;border-radius:20px;padding:28px;border:1px solid #F0E6EA}
.linea{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #E8DCE1;font-size:15px}
.vacio{color:var(--gris);text-align:center;padding:12px 0}
.total{display:flex;justify-content:space-between;font-family:'Fredoka',sans-serif;font-size:24px;margin:16px 0 20px}
.total span:last-child{color:var(--rosa)}
.caja label{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
.caja input,.caja select,.caja textarea{width:100%;font:inherit;padding:11px 14px;border:1px solid #D9CDD3;border-radius:12px;margin-bottom:14px;background:#fff;color:var(--tinta)}
.enviar{display:block;text-align:center;background:#25A55A;color:#fff;padding:15px;border-radius:999px;text-decoration:none;font-weight:600;font-size:17px}
.enviar.off{background:#B9B1C2;pointer-events:none}
.nota{font-size:12px;color:var(--gris);text-align:center;margin-top:10px}
.flot{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;display:none;white-space:nowrap}
.flot.on{display:block}
html,body{max-width:100%;overflow-x:hidden}
img,iframe{max-width:100%}
.hero .wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.contacto .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pops{max-width:100%;gap:8px}
@media(max-width:820px){
.hero .wrap,.contacto .wrap{grid-template-columns:minmax(0,1fr)}
.hero-img{height:auto;width:calc(25% - 8px);max-width:110px}
.hero h1{font-size:30px}
.wrap{padding:0 18px}
}
</style>
</head>
<body>

<section class="contacto" id="contacto">
<div class="wrap">
<div class="info">
<h3>Visítanos</h3>
<p><strong>Horario:</strong> lunes a domingo, 11:00 a 20:00</p>
<p><strong>Dirección:</strong> Tu calle y número, Cuernavaca, Morelos</p>

</div>

</body>
</html>
